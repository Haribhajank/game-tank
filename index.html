<!DOCTYPE html>
<html lang="en" class="h-full bg-slate-950">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>NEON ARENA: Cyber Tank Battle</title>
  <!-- Tailwind CSS -->
  <script src="https://cdn.tailwindcss.com"></script>
  <!-- FontAwesome Icons -->
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
  <style>
    @import url('https://fonts.googleapis.com/css2?family=Orbitron:wght@400;600;800;900&family=Rajdhani:wght@500;600;700&display=swap');

    body {
      font-family: 'Rajdhani', sans-serif;
      user-select: none;
      -webkit-user-select: none;
      touch-action: manipulation;
    }

    .font-orbitron {
      font-family: 'Orbitron', sans-serif;
    }

    /* Custom Cyber Neon Effects */
    .neon-border-cyan {
      box-shadow: 0 0 15px rgba(0, 243, 255, 0.4), inset 0 0 15px rgba(0, 243, 255, 0.2);
      border: 1px solid rgba(0, 243, 255, 0.6);
    }
    
    .neon-border-pink {
      box-shadow: 0 0 15px rgba(255, 0, 127, 0.4), inset 0 0 15px rgba(255, 0, 127, 0.2);
      border: 1px solid rgba(255, 0, 127, 0.6);
    }

    .neon-text-cyan {
      text-shadow: 0 0 8px rgba(0, 243, 255, 0.8), 0 0 20px rgba(0, 243, 255, 0.4);
    }

    .neon-text-pink {
      text-shadow: 0 0 8px rgba(255, 0, 127, 0.8), 0 0 20px rgba(255, 0, 127, 0.4);
    }

    .glass-panel {
      background: rgba(13, 19, 33, 0.85);
      backdrop-filter: blur(16px);
      -webkit-backdrop-filter: blur(16px);
    }

    /* Virtual Joystick Touch Layer */
    .joystick-zone {
      touch-action: none;
    }

    /* Custom Scrollbar */
    ::-webkit-scrollbar {
      width: 6px;
    }
    ::-webkit-scrollbar-track {
      background: rgba(15, 23, 42, 0.6);
    }
    ::-webkit-scrollbar-thumb {
      background: rgba(0, 243, 255, 0.4);
      border-radius: 3px;
    }
  </style>
</head>
<body class="h-full w-full overflow-hidden text-slate-100 bg-slate-950 flex flex-col justify-center items-center">

  <!-- ================= Canvas Game View ================= -->
  <div id="game-wrapper" class="relative w-full h-full flex items-center justify-center">

    <!-- In-Game Cyber Overlay HUD -->

      <!-- Top Bar: Scores & Killfeed -->
      <div class="flex justify-between items-start w-full gap-4">

        <div id="kill-feed" class="flex flex-col gap-1 max-w-xs md:max-w-sm text-xs md:text-sm font-orbitron"></div>

        <!-- Room / Match Header (Top Center) -->

          <div id="hud-score-limit" class="text-xl md:text-2xl font-black text-white font-orbitron">15 KILLS</div>
          <div id="hud-room-tag" class="text-xs text-slate-400 font-mono mt-0.5">ROOM: -</div>
        </div>

        <!-- Dynamic Leaderboard (Top Right) -->

            <i class="fa-solid font-bold fa-trophy text-amber-400"></i> Leaderboard
          </div>
          <div id="leaderboard-list" class="flex flex-col gap-1.5 text-xs"></div>
        </div>
      </div>

      <!-- Center Dynamic Alerts (Kills, Announcements) -->
      <div id="announcement-banner" class="self-center text-center opacity-0 transition-opacity duration-300 font-orbitron pointer-events-none">
        <h2 id="announcement-title" class="text-3xl md:text-5xl font-black neon-text-cyan tracking-wider">MATCH STARTED</h2>
        <p id="announcement-sub" class="text-sm md:text-lg text-slate-300 font-sans mt-1">Eliminate all targets to win!</p>
      </div>

      <!-- Bottom Bar: Player Status & Mobile Touch Controls -->
      <div class="flex justify-between items-end w-full gap-4 pointer-events-auto">
        
        <!-- Player Status Container (Bottom Left) -->
        <div class="glass-panel p-3 md:p-4 rounded-xl border border-cyan-500/30 flex items-center gap-4 min-w-[220px]">
          <div class="relative flex items-center justify-center">
            <div id="hud-avatar-icon" class="w-12 h-12 rounded-lg border-2 border-cyan-400 flex items-center justify-center text-xl bg-slate-900 text-cyan-400">
              <i class="fa-solid fa-crosshairs"></i>
            </div>
            <div id="hud-shield-badge" class="absolute -top-2 -right-2 bg-blue-500 text-white text-[10px] font-bold px-1.5 py-0.5 rounded-full hidden">

            <div id="hud-player-name" class="font-orbitron text-sm font-bold text-white truncate">Player</div>
            <div class="w-full bg-slate-800 rounded-full h-3 border border-slate-700 overflow-hidden mt-1 relative">

              <span id="hud-hp-text" class="absolute inset-0 flex items-center justify-center text-[9px] font-bold text-slate-950 font-orbitron">100 / 100</span>
            </div>
            <div id="hud-powerup-status" class="text-[11px] text-amber-400 font-semibold mt-1 h-4 flex items-center gap-1">

        </div>

        <!-- Touch Controls Joysticks Overlay (Mobile Only) -->

                <option value="15" selected>15 Eliminations</option>
                <option value="25">25 Eliminations</option>

          <!-- Add AI Bot Option in Room -->
          <button id="btn-add-bot" class="w-full py-2 bg-slate-800/80 hover:bg-slate-700 text-slate-300 text-xs font-orbitron font-bold rounded-lg border border-slate-700 flex items-center justify-center gap-2">

        <button id="btn-start-game" class="flex-1 py-3 bg-gradient-to-r from-emerald-500 to-cyan-500 hover:from-emerald-400 hover:to-cyan-400 text-slate-950 font-orbitron font-black text-sm rounded-xl transition-all transform hover:scale-[1.01] shadow-[0_0_20px_rgba(0,255,170,0.4)] flex items-center justify-center gap-2">

  <!-- ================= Victory Overlay Screen ================= -->
  <div id="victory-screen" class="fixed inset-0 z-50 flex items-center justify-center p-4 bg-slate-950/90 backdrop-blur-lg hidden">

      <button id="btn-return-lobby" class="w-full py-3 bg-gradient-to-r from-cyan-500 to-blue-600 text-slate-950 font-orbitron font-black text-sm rounded-xl transition-all hover:scale-105 shadow-[0_0_15px_rgba(0,243,255,0.4)]">

  <!-- ================= Firebase Realtime Script ================= -->
  <script type="module">
    import { initializeApp } from "https://www.gstatic.com/firebasejs/11.6.1/firebase-app.js";
    import { getAuth, signInAnonymously, signInWithCustomToken, onAuthStateChanged } from "https://www.gstatic.com/firebasejs/11.6.1/firebase-auth.js";
    import { getFirestore, doc, setDoc, getDoc, updateDoc, onSnapshot, collection } from "https://www.gstatic.com/firebasejs/11.6.1/firebase-firestore.js";

    // ------------------------------------------------------------------
    // 1. GLOBAL STATE & CONFIG
    // ------------------------------------------------------------------
    const appId = typeof __app_id !== 'undefined' ? __app_id : 'neon-tanks-arena';
    let db = null, auth = null, currentUser = null;
    let roomUnsubscribe = null;

    // Available Tank Colors
    const TANK_COLORS = ['#00f3ff', '#ff007f', '#00ff66', '#ffcc00', '#b026ff', '#ff5500'];

    // Tank Archetypes Stats
    const ARCHETYPES = {
      viper: { name: 'Viper', icon: 'fa-bolt', hp: 100, speed: 3.6, fireRate: 320, damage: 22, colorDesc: 'Balanced Scout' },
      phantom: { name: 'Phantom', icon: 'fa-ghost', hp: 80, speed: 4.8, fireRate: 220, damage: 15, colorDesc: 'High Mobility' },
      titan: { name: 'Titan', icon: 'fa-shield-cat', hp: 150, speed: 2.6, fireRate: 480, damage: 35, colorDesc: 'Heavy Armor' },
      spectre: { name: 'Spectre', icon: 'fa-crosshairs', hp: 85, speed: 3.3, fireRate: 700, damage: 55, colorDesc: 'Sniper Beam' }
    };

    // State Variables
    let localPlayer = {
      id: 'local_' + Math.random().toString(36).substring(2, 8),
      name: 'CYBER_KNIGHT',
      color: TANK_COLORS[0],
      archetype: 'viper',
      x: 300,
      y: 300,
      vx: 0,
      vy: 0,
      angle: 0,
      turretAngle: 0,
      hp: 100,
      maxHp: 100,
      shield: 0,
      score: 0,
      kills: 0,
      deaths: 0,
      isHost: false,
      isBot: false,
      powerup: null,
      powerupTime: 0,
      lastShotTime: 0
    };

    let currentRoomId = null;
    let isSoloMode = false;
    let gameState = 'MENU'; // MENU, LOBBY, PLAYING, VICTORY
    let roomData = null;

    // Simulation Entities
    let players = {};
    let projectiles = [];
    let powerups = [];
    let crates = [];
    let particles = [];
    let hazards = [];
    let arenaWalls = [];
    let killLogs = [];

    // Audio Engine Controls
    let audioEnabled = true;

    // ------------------------------------------------------------------
    // 2. WEB AUDIO API PROCEDURAL SYNTHESIZER
    // ------------------------------------------------------------------
    class SoundEngine {
      constructor() {
        this.ctx = null;
      }

      init() {
        if (!this.ctx) {
          const AudioContext = window.AudioContext || window.webkitAudioContext;
          if (AudioContext) this.ctx = new AudioContext();
        }
        if (this.ctx && this.ctx.state === 'suspended') {
          this.ctx.resume();
        }
      }

      playShoot(archetype = 'viper') {
        if (!audioEnabled) return;
        this.init();
        if (!this.ctx) return;

        const osc = this.ctx.createOscillator();
        const gain = this.ctx.createGain();
        osc.connect(gain);
        gain.connect(this.ctx.destination);

        const now = this.ctx.currentTime;
        if (archetype === 'spectre') {
          // Deep high beam railgun sound
          osc.type = 'sawtooth';
          osc.frequency.setValueAtTime(800, now);
          osc.frequency.exponentialRampToValueAtTime(100, now + 0.3);
          gain.gain.setValueAtTime(0.3, now);
          gain.gain.exponentialRampToValueAtTime(0.01, now + 0.3);
          osc.start(now);
          osc.stop(now + 0.3);
        } else if (archetype === 'phantom') {
          // Rapid chirp
          osc.type = 'square';
          osc.frequency.setValueAtTime(600, now);
          osc.frequency.exponentialRampToValueAtTime(200, now + 0.1);
          gain.gain.setValueAtTime(0.15, now);
          gain.gain.exponentialRampToValueAtTime(0.01, now + 0.1);
          osc.start(now);
          osc.stop(now + 0.1);
        } else {
          // Standard laser
          osc.type = 'triangle';
          osc.frequency.setValueAtTime(450, now);
          osc.frequency.exponentialRampToValueAtTime(80, now + 0.15);
          gain.gain.setValueAtTime(0.25, now);
          gain.gain.exponentialRampToValueAtTime(0.01, now + 0.15);
          osc.start(now);
          osc.stop(now + 0.15);
        }
      }

      playExplosion(heavy = false) {
        if (!audioEnabled) return;
        this.init();
        if (!this.ctx) return;

        const now = this.ctx.currentTime;
        const dur = heavy ? 0.6 : 0.35;
        
        // Noise buffer for explosion rumble
        const bufferSize = this.ctx.sampleRate * dur;
        const buffer = this.ctx.createBuffer(1, bufferSize, this.ctx.sampleRate);
        const data = buffer.getChannelData(0);
        for (let i = 0; i < bufferSize; i++) {
          data[i] = Math.random() * 2 - 1;
        }

        const noise = this.ctx.createBufferSource();
        noise.buffer = buffer;

        const filter = this.ctx.createBiquadFilter();
        filter.type = 'lowpass';
        filter.frequency.setValueAtTime(heavy ? 600 : 900, now);
        filter.frequency.exponentialRampToValueAtTime(40, now + dur);

        const gain = this.ctx.createGain();
        gain.gain.setValueAtTime(heavy ? 0.5 : 0.3, now);
        gain.gain.exponentialRampToValueAtTime(0.01, now + dur);

        noise.connect(filter);
        filter.connect(gain);
        gain.connect(this.ctx.destination);

        noise.start(now);
      }

      playPowerup() {
        if (!audioEnabled) return;
        this.init();
        if (!this.ctx) return;

        const now = this.ctx.currentTime;
        const osc = this.ctx.createOscillator();
        const gain = this.ctx.createGain();
        osc.type = 'sine';
        osc.connect(gain);
        gain.connect(this.ctx.destination);

        osc.frequency.setValueAtTime(300, now);
        osc.frequency.exponentialRampToValueAtTime(900, now + 0.25);
        gain.gain.setValueAtTime(0.2, now);
        gain.gain.exponentialRampToValueAtTime(0.01, now + 0.25);

        osc.start(now);
        osc.stop(now + 0.25);
      }

      playShieldHit() {
        if (!audioEnabled) return;
        this.init();
        if (!this.ctx) return;

        const now = this.ctx.currentTime;
        const osc = this.ctx.createOscillator();
        const gain = this.ctx.createGain();
        osc.type = 'sine';
        osc.connect(gain);
        gain.connect(this.ctx.destination);

        osc.frequency.setValueAtTime(1200, now);
        osc.frequency.exponentialRampToValueAtTime(300, now + 0.15);
        gain.gain.setValueAtTime(0.3, now);
        gain.gain.exponentialRampToValueAtTime(0.01, now + 0.15);

        osc.start(now);
        osc.stop(now + 0.15);
      }
    }
    const soundEngine = new SoundEngine();

    // ------------------------------------------------------------------
    // 3. FIREBASE INITIALIZATION & SYNC ENGINE
    // ------------------------------------------------------------------
    async function initFirebase() {
      try {
        if (typeof __firebase_config !== 'undefined') {
          const config = JSON.parse(__firebase_config);
          const app = initializeApp(config);
          db = getFirestore(app);
          auth = getAuth(app);

          const token = typeof __initial_auth_token !== 'undefined' ? __initial_auth_token : null;
          if (token) {
            await signInWithCustomToken(auth, token);
          } else {
            await signInAnonymously(auth);
          }

          onAuthStateChanged(auth, (user) => {
            if (user) {
              currentUser = user;
              localPlayer.id = user.uid;
            }
          });
        }
      } catch (err) {
        console.warn("Firebase initialized in standalone local mode.", err);
      }
    }

    function getRoomRef(roomId) {
      return doc(db, 'artifacts', appId, 'public', 'data', 'rooms', roomId);
    }

    async function createRoomFirebase() {
      const code = Math.random().toString(36).substring(2, 8).toUpperCase();
      currentRoomId = code;
      localPlayer.isHost = true;
      isSoloMode = false;

      const roomPayload = {
        roomId: code,
        hostId: localPlayer.id,
        status: 'LOBBY',
        map: 'cyber_grid',
        scoreLimit: 15,
        players: {
          [localPlayer.id]: sanitizePlayerData(localPlayer)
        },
        createdAt: Date.now()
      };

      if (db) {
        await setDoc(getRoomRef(code), roomPayload);
        subscribeRoomFirebase(code);
      } else {
        roomData = roomPayload;
        renderLobbyUI();
      }

      showToast(`Room ${code} created!`, 'success');
      switchState('LOBBY');
    }

    async function joinRoomFirebase(code) {
      code = code.trim().toUpperCase();
      if (code.length !== 6) {
        showToast('Invalid 6-character room code', 'error');
        return;
      }

      currentRoomId = code;
      isSoloMode = false;
      localPlayer.isHost = false;

      if (db) {
        try {
          const ref = getRoomRef(code);
          const snap = await getDoc(ref);
          if (!snap.exists()) {
            showToast('Room not found!', 'error');
            return;
          }

          const data = snap.data();
          data.players[localPlayer.id] = sanitizePlayerData(localPlayer);
          await updateDoc(ref, { players: data.players });
          subscribeRoomFirebase(code);
          showToast(`Joined Room ${code}`, 'success');
          switchState('LOBBY');
        } catch (e) {
          showToast('Failed to join room', 'error');
        }
      } else {
        showToast('Firestore offline. Operating in Solo mode.', 'warning');
        startSoloMode();
      }
    }

    function subscribeRoomFirebase(code) {
      if (!db) return;
      if (roomUnsubscribe) roomUnsubscribe();

      roomUnsubscribe = onSnapshot(getRoomRef(code), (snap) => {
        if (!snap.exists()) return;
        roomData = snap.data();
        
        // Dynamic Player Synchronization
        if (roomData.players) {
          Object.keys(roomData.players).forEach(id => {
            if (id !== localPlayer.id) {
              const remote = roomData.players[id];
              if (!players[id]) {
                players[id] = remote;
              } else {
                // Lerp remote player position & angles smoothly
                players[id].x += (remote.x - players[id].x) * 0.3;
                players[id].y += (remote.y - players[id].y) * 0.3;
                players[id].angle = remote.angle;
                players[id].turretAngle = remote.turretAngle;
                players[id].hp = remote.hp;
                players[id].shield = remote.shield;
                players[id].score = remote.score;
                players[id].kills = remote.kills;
                players[id].deaths = remote.deaths;
                players[id].name = remote.name;
                players[id].color = remote.color;
                players[id].archetype = remote.archetype;
              }
            }
          });

          // Remove disconnected players
          Object.keys(players).forEach(id => {
            if (id !== localPlayer.id && !roomData.players[id]) {
              delete players[id];
            }
          });
        }

        // Room Status changes
        if (roomData.status === 'PLAYING' && gameState === 'LOBBY') {
          startBattleSession();
        } else if (roomData.status === 'VICTORY' && gameState !== 'VICTORY') {
          triggerVictoryState(roomData.winner);
        }

        if (gameState === 'LOBBY') {
          renderLobbyUI();
        }
      }, (err) => {
        console.error("Firestore sync error:", err);
      });
    }

    function sanitizePlayerData(p) {
      return {
        id: p.id,
        name: p.name,
        color: p.color,
        archetype: p.archetype,
        x: p.x,
        y: p.y,
        angle: p.angle,
        turretAngle: p.turretAngle,
        hp: p.hp,
        shield: p.shield,
        score: p.score,
        kills: p.kills,
        deaths: p.deaths,
        isHost: p.isHost,
        isBot: p.isBot || false,
        lastUpdated: Date.now()
      };
    }

    // Sync Local State to Firestore (Throttled)
    let lastSyncTime = 0;
    function syncLocalPlayerState() {
      if (!db || !currentRoomId || isSoloMode || gameState !== 'PLAYING') return;
      const now = Date.now();
      if (now - lastSyncTime < 45) return; // ~22 updates per sec
      lastSyncTime = now;

      const pRef = getRoomRef(currentRoomId);
      updateDoc(pRef, {
        [`players.${localPlayer.id}`]: sanitizePlayerData(localPlayer)
      }).catch(() => {});
    }

    // ------------------------------------------------------------------
    // 4. MAP GENERATOR & GAME OBJECTS
    // ------------------------------------------------------------------
    function generateArenaMap(mapType = 'cyber_grid') {
      arenaWalls = [];
      crates = [];
      hazards = [];

      const canvas = document.getElementById('gameCanvas');
      const w = canvas.width;
      const h = canvas.height;

      // Outer boundary walls
      const wallThickness = 24;
      arenaWalls.push({ x: 0, y: 0, width: w, height: wallThickness }); // Top
      arenaWalls.push({ x: 0, y: h - wallThickness, width: w, height: wallThickness }); // Bottom
      arenaWalls.push({ x: 0, y: 0, width: wallThickness, height: h }); // Left
      arenaWalls.push({ x: w - wallThickness, y: 0, width: wallThickness, height: h }); // Right

      if (mapType === 'cyber_grid') {
        // Inner Obstacles
        arenaWalls.push({ x: w * 0.25, y: h * 0.25, width: 120, height: 24 });
        arenaWalls.push({ x: w * 0.25, y: h * 0.25, width: 24, height: 120 });

        arenaWalls.push({ x: w * 0.75 - 120, y: h * 0.25, width: 120, height: 24 });
        arenaWalls.push({ x: w * 0.75 - 24, y: h * 0.25, width: 24, height: 120 });

        arenaWalls.push({ x: w * 0.25, y: h * 0.75 - 24, width: 120, height: 24 });
        arenaWalls.push({ x: w * 0.25, y: h * 0.75 - 120, width: 24, height: 120 });

        arenaWalls.push({ x: w * 0.75 - 120, y: h * 0.75 - 24, width: 120, height: 24 });
        arenaWalls.push({ x: w * 0.75 - 24, y: h * 0.75 - 120, width: 24, height: 120 });

        // Destructible crates
        spawnCrateGrid([
          { x: w * 0.5 - 40, y: h * 0.3 },
          { x: w * 0.5 + 40, y: h * 0.3 },
          { x: w * 0.5 - 40, y: h * 0.7 },
          { x: w * 0.5 + 40, y: h * 0.7 },
          { x: w * 0.3, y: h * 0.5 },
          { x: w * 0.7, y: h * 0.5 }
        ]);
      } else if (mapType === 'neon_maze') {
        arenaWalls.push({ x: w * 0.4, y: wallThickness, width: 24, height: h * 0.3 });
        arenaWalls.push({ x: w * 0.6, y: h * 0.7, width: 24, height: h * 0.3 - wallThickness });
        arenaWalls.push({ x: w * 0.2, y: h * 0.4, width: w * 0.25, height: 24 });
        arenaWalls.push({ x: w * 0.55, y: h * 0.6, width: w * 0.25, height: 24 });

        spawnCrateGrid([
          { x: w * 0.5, y: h * 0.5 },
          { x: w * 0.2, y: h * 0.2 },
          { x: w * 0.8, y: h * 0.8 },
          { x: w * 0.3, y: h * 0.8 }
        ]);
      } else if (mapType === 'void_hazards') {
        // Center hazard turrets
        hazards.push({ x: w * 0.35, y: h * 0.5, radius: 25, angle: 0, rotSpeed: 0.02, beamLength: 180 });
        hazards.push({ x: w * 0.65, y: h * 0.5, radius: 25, angle: Math.PI, rotSpeed: -0.02, beamLength: 180 });

        spawnCrateGrid([
          { x: w * 0.5, y: h * 0.25 },
          { x: w * 0.5, y: h * 0.75 }
        ]);
      }
    }

    function spawnCrateGrid(coords) {
      coords.forEach((c, idx) => {
        crates.push({
          id: 'crate_' + idx + '_' + Math.random(),
          x: c.x,
          y: c.y,
          size: 32,
          hp: 40,
          maxHp: 40
        });
      });
    }

    function spawnPowerup(x, y) {
      const types = ['SHIELD', 'RAPID_FIRE', 'SPREAD', 'RAILGUN', 'SPEED', 'REPAIR'];
      const chosen = types[Math.floor(Math.random() * types.length)];
      powerups.push({
        id: 'pow_' + Math.random(),
        x,
        y,
        type: chosen,
        size: 20,
        createdAt: Date.now()
      });
    }

    // ------------------------------------------------------------------
    // 5. INPUT MANAGEMENT & TOUCH CONTROLS
    // ------------------------------------------------------------------
    const keys = {};
    let mousePos = { x: 0, y: 0 };
    let touchMoveVector = { x: 0, y: 0 };
    let touchAimAngle = null;
    let isTouchFiring = false;

    window.addEventListener('keydown', (e) => {
      keys[e.key.toLowerCase()] = true;
      if (['arrowup', 'arrowdown', 'arrowleft', 'arrowright', ' '].includes(e.key.toLowerCase())) {
        e.preventDefault();
      }
    });

    window.addEventListener('keyup', (e) => {
      keys[e.key.toLowerCase()] = false;
    });

    const canvas = document.getElementById('gameCanvas');
    canvas.addEventListener('mousemove', (e) => {
      const rect = canvas.getBoundingClientRect();
      mousePos.x = e.clientX - rect.left;
      mousePos.y = e.clientY - rect.top;
    });

    canvas.addEventListener('mousedown', (e) => {
      if (e.button === 0 && gameState === 'PLAYING') {
        firePlayerShot(localPlayer);
      }
    });

    // Touch Virtual Joysticks logic
    function setupTouchControls() {
      const moveZone = document.getElementById('touch-move-zone');
      const moveKnob = document.getElementById('touch-move-knob');
      const fireZone = document.getElementById('touch-fire-zone');
      const fireKnob = document.getElementById('touch-fire-knob');

      if (!moveZone || !fireZone) return;

      // Show touch controls if touch device detected
      window.addEventListener('touchstart', () => {
        document.getElementById('mobile-controls').classList.remove('hidden');
      }, { once: true });

      let moveTouchId = null;
      let fireTouchId = null;
      let moveCenter = { x: 0, y: 0 };
      let fireCenter = { x: 0, y: 0 };

      moveZone.addEventListener('touchstart', (e) => {
        const touch = e.changedTouches[0];
        moveTouchId = touch.identifier;
        const rect = moveZone.getBoundingClientRect();
        moveCenter = { x: rect.left + rect.width / 2, y: rect.top + rect.height / 2 };
        updateJoystick(touch, moveCenter, moveKnob, (dx, dy) => {
          touchMoveVector = { x: dx, y: dy };
        });
      });

      moveZone.addEventListener('touchmove', (e) => {
        for (let i = 0; i < e.changedTouches.length; i++) {
          if (e.changedTouches[i].identifier === moveTouchId) {
            updateJoystick(e.changedTouches[i], moveCenter, moveKnob, (dx, dy) => {
              touchMoveVector = { x: dx, y: dy };
            });
          }
        }
      });

      const resetMove = (e) => {
        for (let i = 0; i < e.changedTouches.length; i++) {
          if (e.changedTouches[i].identifier === moveTouchId) {
            moveKnob.style.transform = `translate(0px, 0px)`;
            touchMoveVector = { x: 0, y: 0 };
            moveTouchId = null;
          }
        }
      };
      moveZone.addEventListener('touchend', resetMove);
      moveZone.addEventListener('touchcancel', resetMove);

      // Fire Touch Zone
      fireZone.addEventListener('touchstart', (e) => {
        const touch = e.changedTouches[0];
        fireTouchId = touch.identifier;
        const rect = fireZone.getBoundingClientRect();
        fireCenter = { x: rect.left + rect.width / 2, y: rect.top + rect.height / 2 };
        isTouchFiring = true;
        updateJoystick(touch, fireCenter, fireKnob, (dx, dy) => {
          touchAimAngle = Math.atan2(dy, dx);
        });
      });

      fireZone.addEventListener('touchmove', (e) => {
        for (let i = 0; i < e.changedTouches.length; i++) {
          if (e.changedTouches[i].identifier === fireTouchId) {
            updateJoystick(e.changedTouches[i], fireCenter, fireKnob, (dx, dy) => {
              touchAimAngle = Math.atan2(dy, dx);
            });
          }
        }
      });

      const resetFire = (e) => {
        for (let i = 0; i < e.changedTouches.length; i++) {
          if (e.changedTouches[i].identifier === fireTouchId) {
            fireKnob.style.transform = `translate(0px, 0px)`;
            isTouchFiring = false;
            fireTouchId = null;
          }
        }
      };
      fireZone.addEventListener('touchend', resetFire);
      fireZone.addEventListener('touchcancel', resetFire);
    }

    function updateJoystick(touch, center, knobElem, callback) {
      const maxDist = 45;
      let dx = touch.clientX - center.x;
      let dy = touch.clientY - center.y;
      const dist = Math.hypot(dx, dy);

      if (dist > maxDist) {
        dx = (dx / dist) * maxDist;
        dy = (dy / dist) * maxDist;
      }

      knobElem.style.transform = `translate(${dx}px, ${dy}px)`;
      callback(dx / maxDist, dy / maxDist);
    }

    // ------------------------------------------------------------------
    // 6. GAME LOGIC & SIMULATION LOOP
    // ------------------------------------------------------------------
    function updateGamePhysics() {
      if (gameState !== 'PLAYING') return;

      const arch = ARCHETYPES[localPlayer.archetype] || ARCHETYPES.viper;
      let currentSpeed = arch.speed;

      if (localPlayer.powerup === 'SPEED') currentSpeed *= 1.45;

      // Local player movement
      let moveX = 0;
      let moveY = 0;

      if (keys['w'] || keys['arrowup']) moveY -= 1;
      if (keys['s'] || keys['arrowdown']) moveY += 1;
      if (keys['a'] || keys['arrowleft']) moveX -= 1;
      if (keys['d'] || keys['arrowright']) moveX += 1;

      // Combine with touch vector
      if (touchMoveVector.x !== 0 || touchMoveVector.y !== 0) {
        moveX = touchMoveVector.x;
        moveY = touchMoveVector.y;
      }

      const length = Math.hypot(moveX, moveY);
      if (length > 0) {
        moveX /= length;
        moveY /= length;

        const nextX = localPlayer.x + moveX * currentSpeed;
        const nextY = localPlayer.y + moveY * currentSpeed;

        if (!checkTankWallCollision(nextX, localPlayer.y, 22)) localPlayer.x = nextX;
        if (!checkTankWallCollision(localPlayer.x, nextY, 22)) localPlayer.y = nextY;

        localPlayer.angle = Math.atan2(moveY, moveX);

        // Spawn engine trail particles
        if (Math.random() < 0.4) {
          particles.push({
            x: localPlayer.x - Math.cos(localPlayer.angle) * 18,
            y: localPlayer.y - Math.sin(localPlayer.angle) * 18,
            vx: (Math.random() - 0.5) * 0.8,
            vy: (Math.random() - 0.5) * 0.8,
            life: 0.6,
            color: localPlayer.color,
            size: Math.random() * 4 + 2
          });
        }
      }

      // Turret Aim Calculation
      if (touchAimAngle !== null) {
        localPlayer.turretAngle = touchAimAngle;
        if (isTouchFiring) firePlayerShot(localPlayer);
      } else {
        localPlayer.turretAngle = Math.atan2(mousePos.y - localPlayer.y, mousePos.x - localPlayer.x);
      }

      // Active Powerup timer decay
      if (localPlayer.powerup && Date.now() > localPlayer.powerupTime) {
        localPlayer.powerup = null;
        updateHUDStatus();
      }

      // Update AI Bots if Host or Solo Mode
      if (localPlayer.isHost || isSoloMode) {
        updateBotAI();
        updateHazards();
      }

      // Update Projectiles
      for (let i = projectiles.length - 1; i >= 0; i--) {
        const p = projectiles[i];
        p.x += p.vx;
        p.y += p.vy;
        p.life -= 0.016;

        // Collision with walls & Bouncing
        let hitWall = false;
        arenaWalls.forEach(w => {
          if (p.x > w.x && p.x < w.x + w.width && p.y > w.y && p.y < w.y + w.height) {
            hitWall = true;
            if (p.bounces > 0) {
              p.bounces--;
              // Simple bounce reflection
              if (p.x - p.vx <= w.x || p.x - p.vx >= w.x + w.width) p.vx *= -1;
              else p.vy *= -1;
            }
          }
        });

        if (hitWall && p.bounces <= 0) {
          createImpactSparks(p.x, p.y, p.color);
          projectiles.splice(i, 1);
          continue;
        }

        // Collision with Crates
        for (let cIdx = crates.length - 1; cIdx >= 0; cIdx--) {
          const crate = crates[cIdx];
          if (Math.hypot(p.x - crate.x, p.y - crate.y) < crate.size / 2 + 4) {
            crate.hp -= p.damage;
            createImpactSparks(p.x, p.y, '#f59e0b');
            projectiles.splice(i, 1);

            if (crate.hp <= 0) {
              soundEngine.playExplosion(false);
              spawnPowerup(crate.x, crate.y);
              createExplosionParticles(crate.x, crate.y, '#f59e0b', 12);
              crates.splice(cIdx, 1);
            }
            break;
          }
        }

        if (i < 0 || !projectiles[i]) continue;

        // Collision with Tanks (Local + Remote + Bots)
        const allTargets = [localPlayer, ...Object.values(players)];
        for (const target of allTargets) {
          if (target.id === p.ownerId || target.hp <= 0) continue;

          if (Math.hypot(p.x - target.x, p.y - target.y) < 22) {
            // Hit tank!
            applyDamageToTank(target, p.damage, p.ownerId);
            createImpactSparks(p.x, p.y, target.color);
            projectiles.splice(i, 1);
            break;
          }
        }

        if (p.life <= 0) projectiles.splice(i, 1);
      }

      // Check Powerup Pickups
      for (let i = powerups.length - 1; i >= 0; i--) {
        const pow = powerups[i];
        if (Math.hypot(localPlayer.x - pow.x, localPlayer.y - pow.y) < 30) {
          applyPowerupToPlayer(localPlayer, pow.type);
          soundEngine.playPowerup();
          powerups.splice(i, 1);
        }
      }

      // Update Particles
      for (let i = particles.length - 1; i >= 0; i--) {
        const pt = particles[i];
        pt.x += pt.vx;
        pt.y += pt.vy;
        pt.life -= 0.02;
        if (pt.life <= 0) particles.splice(i, 1);
      }

      // Sync player data to Firestore
      syncLocalPlayerState();
    }

    function checkTankWallCollision(x, y, radius) {
      return arenaWalls.some(w => {
        const closestX = Math.max(w.x, Math.min(x, w.x + w.width));
        const closestY = Math.max(w.y, Math.min(y, w.y + w.height));
        const distanceX = x - closestX;
        const distanceY = y - closestY;
        return (distanceX * distanceX + distanceY * distanceY) < (radius * radius);
      });
    }

    function firePlayerShot(p) {
      const arch = ARCHETYPES[p.archetype] || ARCHETYPES.viper;
      let cooldown = arch.fireRate;
      if (p.powerup === 'RAPID_FIRE') cooldown *= 0.45;

      const now = Date.now();
      if (now - p.lastShotTime < cooldown) return;
      p.lastShotTime = now;

      soundEngine.playShoot(p.archetype);

      const barrelLen = 28;
      const muzzleX = p.x + Math.cos(p.turretAngle) * barrelLen;
      const muzzleY = p.y + Math.sin(p.turretAngle) * barrelLen;

      if (p.powerup === 'SPREAD') {
        const angles = [p.turretAngle - 0.22, p.turretAngle, p.turretAngle + 0.22];
        angles.forEach(ang => spawnSingleProjectile(p, muzzleX, muzzleY, ang, arch.damage * 0.85));
      } else if (p.powerup === 'RAILGUN' || p.archetype === 'spectre') {
        spawnSingleProjectile(p, muzzleX, muzzleY, p.turretAngle, arch.damage * 1.3, 14, 0);
      } else {
        spawnSingleProjectile(p, muzzleX, muzzleY, p.turretAngle, arch.damage, 9, 1);
      }

      // Muzzle flash particle
      particles.push({
        x: muzzleX,
        y: muzzleY,
        vx: 0,
        vy: 0,
        life: 0.15,
        color: '#ffffff',
        size: 8
      });
    }

    function spawnSingleProjectile(p, x, y, angle, damage, speed = 9, bounces = 1) {
      projectiles.push({
        id: 'proj_' + Math.random(),
        ownerId: p.id,
        x,
        y,
        vx: Math.cos(angle) * speed,
        vy: Math.sin(angle) * speed,
        damage,
        bounces,
        color: p.color,
        life: 2.5
      });
    }

    function applyDamageToTank(target, damage, attackerId) {
      if (target.shield > 0) {
        soundEngine.playShieldHit();
        target.shield -= damage;
        if (target.shield < 0) {
          target.hp += target.shield; // Overflow to HP
          target.shield = 0;
        }
      } else {
        target.hp -= damage;
      }

      if (target.id === localPlayer.id) {
        screenShake(6);
        updateHUDStatus();
      }

      if (target.hp <= 0) {
        soundEngine.playExplosion(true);
        createExplosionParticles(target.x, target.y, target.color, 35);
        screenShake(12);

        // Find attacker
        let attacker = target.id === localPlayer.id ? null : localPlayer;
        if (!attacker && players[attackerId]) attacker = players[attackerId];

        target.deaths++;
        if (attacker) {
          attacker.kills++;
          attacker.score += 1;
          addKillLog(attacker.name, target.name, attacker.color);
        } else {
          addKillLog('ARENA HAZARD', target.name, '#ff0055');
        }

        // Check Victory Score Limit
        const scoreLimit = roomData?.scoreLimit || 15;
        if (attacker && attacker.score >= scoreLimit) {
          if (localPlayer.isHost || isSoloMode) {
            triggerVictoryState(attacker);
          }
        } else {
          respawnTank(target);
        }
      }
    }

    function respawnTank(p) {
      const canvas = document.getElementById('gameCanvas');
      p.hp = p.maxHp;
      p.shield = 0;
      p.powerup = null;
      p.x = 80 + Math.random() * (canvas.width - 160);
      p.y = 80 + Math.random() * (canvas.height - 160);
      if (p.id === localPlayer.id) updateHUDStatus();
    }

    function applyPowerupToPlayer(p, type) {
      p.powerup = type;
      p.powerupTime = Date.now() + 8000; // 8 seconds duration

      if (type === 'SHIELD') {
        p.shield = 60;
      } else if (type === 'REPAIR') {
        p.hp = Math.min(p.maxHp, p.hp + 50);
        p.powerup = null;
      }
      if (p.id === localPlayer.id) updateHUDStatus();
    }

    // ------------------------------------------------------------------
    // 7. BOT AI LOGIC (OFFLINE / PRACTICE / MULTIPLAYER BOT)
    // ------------------------------------------------------------------
    function updateBotAI() {
      Object.values(players).forEach(p => {
        if (!p.isBot || p.hp <= 0) return;

        // Find closest enemy target
        const targets = [localPlayer, ...Object.values(players)].filter(t => t.id !== p.id && t.hp > 0);
        if (targets.length === 0) return;

        let closest = targets[0];
        let minDist = Math.hypot(closest.x - p.x, closest.y - p.y);
        targets.forEach(t => {
          const d = Math.hypot(t.x - p.x, t.y - p.y);
          if (d < minDist) {
            minDist = d;
            closest = t;
          }
        });

        // AI Steering
        const angleToTarget = Math.atan2(closest.y - p.y, closest.x - p.x);
        p.turretAngle = angleToTarget;

        let moveSpeed = (ARCHETYPES[p.archetype] || ARCHETYPES.viper).speed * 0.8;
        const nextX = p.x + Math.cos(angleToTarget) * moveSpeed;
        const nextY = p.y + Math.sin(angleToTarget) * moveSpeed;

        if (!checkTankWallCollision(nextX, p.y, 22)) p.x = nextX;
        if (!checkTankWallCollision(p.x, nextY, 22)) p.y = nextY;

        // Shoot AI projectile
        if (Math.random() < 0.035 && minDist < 450) {
          firePlayerShot(p);
        }
      });
    }

    function updateHazards() {
      hazards.forEach(h => {
        h.angle += h.rotSpeed;

        // Check hazard laser collision with tanks
        const beamEndX = h.x + Math.cos(h.angle) * h.beamLength;
        const beamEndY = h.y + Math.sin(h.angle) * h.beamLength;

        const allTanks = [localPlayer, ...Object.values(players)];
        allTanks.forEach(t => {
          if (t.hp <= 0) return;
          // Distance from point to line segment
          const dist = distToSegment({ x: t.x, y: t.y }, { x: h.x, y: h.y }, { x: beamEndX, y: beamEndY });
          if (dist < 20) {
            applyDamageToTank(t, 2, 'hazard');
          }
        });
      });
    }

    function distToSegment(p, v, w) {
      const l2 = (w.x - v.x) ** 2 + (w.y - v.y) ** 2;
      if (l2 === 0) return Math.hypot(p.x - v.x, p.y - v.y);
      let t = ((p.x - v.x) * (w.x - v.x) + (p.y - v.y) * (w.y - v.y)) / l2;
      t = Math.max(0, Math.min(1, t));
      return Math.hypot(p.x - (v.x + t * (w.x - v.x)), p.y - (v.y + t * (w.y - v.y)));
    }

    // ------------------------------------------------------------------
    // 8. CANVAS RENDERER & VISUAL EFFECTS
    // ------------------------------------------------------------------
    let shakeIntensity = 0;
    function screenShake(amount) {
      shakeIntensity = amount;
    }

    function renderCanvasFrame() {
      const canvas = document.getElementById('gameCanvas');
      const ctx = canvas.getContext('2d');

      // Resize canvas gracefully to container
      if (canvas.width !== window.innerWidth || canvas.height !== window.innerHeight) {
        canvas.width = window.innerWidth;
        canvas.height = window.innerHeight;
        generateArenaMap(roomData?.map || 'cyber_grid');
      }

      ctx.save();

      // Screen Shake Transform
      if (shakeIntensity > 0) {
        const dx = (Math.random() - 0.5) * shakeIntensity;
        const dy = (Math.random() - 0.5) * shakeIntensity;
        ctx.translate(dx, dy);
        shakeIntensity *= 0.88;
        if (shakeIntensity < 0.5) shakeIntensity = 0;
      }

      // Background Cyber Grid Pattern
      ctx.fillStyle = '#070a14';
      ctx.fillRect(0, 0, canvas.width, canvas.height);

      ctx.strokeStyle = 'rgba(0, 243, 255, 0.04)';
      ctx.lineWidth = 1;
      const gridSize = 40;
      for (let x = 0; x < canvas.width; x += gridSize) {
        ctx.beginPath();
        ctx.moveTo(x, 0);
        ctx.lineTo(x, canvas.height);
        ctx.stroke();
      }
      for (let y = 0; y < canvas.height; y += gridSize) {
        ctx.beginPath();
        ctx.moveTo(0, y);
        ctx.lineTo(canvas.width, y);
        ctx.stroke();
      }

      // Render Obstacle Walls
      arenaWalls.forEach(w => {
        ctx.fillStyle = '#0f172a';
        ctx.fillRect(w.x, w.y, w.width, w.height);
        ctx.strokeStyle = '#00f3ff';
        ctx.shadowColor = '#00f3ff';
        ctx.shadowBlur = 8;
        ctx.lineWidth = 2;
        ctx.strokeRect(w.x, w.y, w.width, w.height);
        ctx.shadowBlur = 0;
      });

      // Render Destructible Crates
      crates.forEach(c => {
        ctx.fillStyle = '#1e293b';
        ctx.fillRect(c.x - c.size / 2, c.y - c.size / 2, c.size, c.size);
        ctx.strokeStyle = '#f59e0b';
        ctx.shadowColor = '#f59e0b';
        ctx.shadowBlur = 6;
        ctx.lineWidth = 2;
        ctx.strokeRect(c.x - c.size / 2, c.y - c.size / 2, c.size, c.size);

        // Crate cross pattern
        ctx.beginPath();
        ctx.moveTo(c.x - c.size / 2, c.y - c.size / 2);
        ctx.lineTo(c.x + c.size / 2, c.y + c.size / 2);
        ctx.moveTo(c.x + c.size / 2, c.y - c.size / 2);
        ctx.lineTo(c.x - c.size / 2, c.y + c.size / 2);
        ctx.stroke();
        ctx.shadowBlur = 0;
      });

      // Render Hazards
      hazards.forEach(h => {
        ctx.save();
        ctx.translate(h.x, h.y);
        ctx.fillStyle = '#ff0055';
        ctx.shadowColor = '#ff0055';
        ctx.shadowBlur = 12;
        ctx.beginPath();
        ctx.arc(0, 0, h.radius, 0, Math.PI * 2);
        ctx.fill();

        // Laser Beam
        ctx.rotate(h.angle);
        ctx.strokeStyle = '#ff0055';
        ctx.lineWidth = 4;
        ctx.beginPath();
        ctx.moveTo(0, 0);
        ctx.lineTo(h.beamLength, 0);
        ctx.stroke();
        ctx.restore();
      });

      // Render Powerups
      powerups.forEach(p => {
        ctx.save();
        ctx.translate(p.x, p.y);
        ctx.shadowColor = '#38bdf8';
        ctx.shadowBlur = 12;

        ctx.fillStyle = '#0284c7';
        ctx.beginPath();
        ctx.arc(0, 0, p.size, 0, Math.PI * 2);
        ctx.fill();

        ctx.fillStyle = '#ffffff';
        ctx.font = '10px Orbitron';
        ctx.textAlign = 'center';
        ctx.textBaseline = 'middle';
        ctx.fillText(p.type.substring(0, 3), 0, 0);
        ctx.restore();
      });

      // Render Projectiles
      projectiles.forEach(p => {
        ctx.save();
        ctx.fillStyle = p.color;
        ctx.shadowColor = p.color;
        ctx.shadowBlur = 10;
        ctx.beginPath();
        ctx.arc(p.x, p.y, 4, 0, Math.PI * 2);
        ctx.fill();
        ctx.restore();
      });

      // Render Particles
      particles.forEach(pt => {
        ctx.save();
        ctx.fillStyle = pt.color;
        ctx.globalAlpha = pt.life;
        ctx.shadowColor = pt.color;
        ctx.shadowBlur = 6;
        ctx.beginPath();
        ctx.arc(pt.x, pt.y, pt.size, 0, Math.PI * 2);
        ctx.fill();
        ctx.restore();
      });

      // Render Tanks (Local & Remote & Bots)
      const allTanks = [localPlayer, ...Object.values(players)];
      allTanks.forEach(p => {
        if (p.hp <= 0) return;
        renderTankSprite(ctx, p);
      });

      ctx.restore();
    }

    function renderTankSprite(ctx, p) {
      ctx.save();
      ctx.translate(p.x, p.y);

      // Tank Body & Tracks
      ctx.save();
      ctx.rotate(p.angle);

      // Treads
      ctx.fillStyle = '#1e293b';
      ctx.fillRect(-22, -20, 44, 8);
      ctx.fillRect(-22, 12, 44, 8);

      // Chassis Core
      ctx.fillStyle = p.color;
      ctx.shadowColor = p.color;
      ctx.shadowBlur = 12;
      ctx.fillRect(-18, -14, 36, 28);
      ctx.shadowBlur = 0;

      ctx.restore();

      // Shield Aura
      if (p.shield > 0) {
        ctx.strokeStyle = '#38bdf8';
        ctx.shadowColor = '#38bdf8';
        ctx.shadowBlur = 15;
        ctx.lineWidth = 3;
        ctx.beginPath();
        ctx.arc(0, 0, 28, 0, Math.PI * 2);
        ctx.stroke();
        ctx.shadowBlur = 0;
      }

      // Turret Hub & Barrel
      ctx.rotate(p.turretAngle);
      ctx.fillStyle = '#0f172a';
      ctx.strokeStyle = p.color;
      ctx.lineWidth = 2;
      ctx.fillRect(0, -4, 26, 8); // Barrel
      ctx.strokeRect(0, -4, 26, 8);

      ctx.beginPath();
      ctx.arc(0, 0, 12, 0, Math.PI * 2);
      ctx.fillStyle = '#1e293b';
      ctx.fill();
      ctx.stroke();

      ctx.restore();

      // Nameplate & HP Bar Above Tank
      ctx.save();
      ctx.font = '10px Rajdhani';
      ctx.fillStyle = '#ffffff';
      ctx.textAlign = 'center';
      ctx.fillText(p.name, p.x, p.y - 32);

      // Health Bar
      const barW = 40;
      const barH = 4;
      ctx.fillStyle = 'rgba(15, 23, 42, 0.8)';
      ctx.fillRect(p.x - barW / 2, p.y - 28, barW, barH);
      ctx.fillStyle = p.color;
      ctx.fillRect(p.x - barW / 2, p.y - 28, (p.hp / p.maxHp) * barW, barH);
      ctx.restore();
    }

    function createExplosionParticles(x, y, color, count = 20) {
      for (let i = 0; i < count; i++) {
        const ang = Math.random() * Math.PI * 2;
        const spd = Math.random() * 5 + 1;
        particles.push({
          x,
          y,
          vx: Math.cos(ang) * spd,
          vy: Math.sin(ang) * spd,
          life: Math.random() * 0.6 + 0.4,
          color: color,
          size: Math.random() * 5 + 2
        });
      }
    }

    function createImpactSparks(x, y, color) {
      for (let i = 0; i < 6; i++) {
        const ang = Math.random() * Math.PI * 2;
        const spd = Math.random() * 3 + 1;
        particles.push({
          x,
          y,
          vx: Math.cos(ang) * spd,
          vy: Math.sin(ang) * spd,
          life: 0.25,
          color: color,
          size: 2
        });
      }
    }

    // Main Game Animation Loop
    function gameLoop() {
      updateGamePhysics();
      renderCanvasFrame();
      renderLeaderboardHUD();
      requestAnimationFrame(gameLoop);
    }

    // ------------------------------------------------------------------
    // 9. UI & HUD EVENT HANDLERS
    // ------------------------------------------------------------------
    function switchState(newState) {
      gameState = newState;
      document.getElementById('menu-screen').classList.add('hidden');
      document.getElementById('lobby-screen').classList.add('hidden');
      document.getElementById('game-hud').classList.add('hidden');
      document.getElementById('victory-screen').classList.add('hidden');

      if (newState === 'MENU') {
        document.getElementById('menu-screen').classList.remove('hidden');
      } else if (newState === 'LOBBY') {
        document.getElementById('lobby-screen').classList.remove('hidden');
      } else if (newState === 'PLAYING') {
        document.getElementById('game-hud').classList.remove('hidden');
      } else if (newState === 'VICTORY') {
        document.getElementById('victory-screen').classList.remove('hidden');
      }
    }

    function renderLobbyUI() {
      document.getElementById('lobby-code-display').innerText = currentRoomId || 'SOLO';
      const pList = document.getElementById('lobby-player-list');
      pList.innerHTML = '';

      const all = [localPlayer, ...Object.values(players)];
      document.getElementById('lobby-player-count').innerText = `${all.length} / 6`;

      all.forEach(p => {
        const row = document.createElement('div');
        row.className = 'flex items-center justify-between bg-slate-950 p-2 rounded-lg border border-slate-800 text-xs font-orbitron';
        row.innerHTML = `
          <div class="flex items-center gap-2">
            <span class="w-3 h-3 rounded-full" style="background-color: ${p.color}"></span>
            <span class="font-bold text-slate-200">${p.name} ${p.isHost ? '<i class="fa-solid fa-crown text-amber-400 ml-1"></i>' : ''}</span>
          </div>
          <span class="text-[10px] text-cyan-400 uppercase font-mono">${(ARCHETYPES[p.archetype] || ARCHETYPES.viper).name}</span>
        `;
        pList.appendChild(row);
      });

      // Disable host controls if not host
      document.getElementById('select-map').disabled = !localPlayer.isHost;
      document.getElementById('select-score-limit').disabled = !localPlayer.isHost;
      document.getElementById('btn-start-game').style.display = localPlayer.isHost ? 'flex' : 'none';
    }

    function renderLeaderboardHUD() {
      if (gameState !== 'PLAYING') return;
      const lb = document.getElementById('leaderboard-list');
      lb.innerHTML = '';

      const sorted = [localPlayer, ...Object.values(players)].sort((a, b) => b.score - a.score);
      sorted.slice(0, 4).forEach(p => {
        const item = document.createElement('div');
        item.className = 'flex justify-between items-center text-slate-300 font-mono';
        item.innerHTML = `
          <div class="flex items-center gap-1.5 truncate">
            <span class="w-2 h-2 rounded-full" style="background-color: ${p.color}"></span>
            <span class="truncate font-bold ${p.id === localPlayer.id ? 'text-cyan-400' : ''}">${p.name}</span>
          </div>
          <span class="font-black text-amber-400">${p.score} K</span>
        `;
        lb.appendChild(item);
      });
    }

    function updateHUDStatus() {
      document.getElementById('hud-player-name').innerText = localPlayer.name;
      const hpPct = Math.max(0, (localPlayer.hp / localPlayer.maxHp) * 100);
      document.getElementById('hud-hp-bar').style.width = `${hpPct}%`;
      document.getElementById('hud-hp-text').innerText = `${Math.ceil(localPlayer.hp)} / ${localPlayer.maxHp}`;

      const shieldBadge = document.getElementById('hud-shield-badge');
      if (localPlayer.shield > 0) shieldBadge.classList.remove('hidden');
      else shieldBadge.classList.add('hidden');

      const statusBox = document.getElementById('hud-powerup-status');
      if (localPlayer.powerup) {
        statusBox.innerHTML = `<i class="fa-solid fa-bolt text-amber-400"></i> ${localPlayer.powerup} ACTIVE`;
      } else {
        statusBox.innerHTML = '';
      }
    }

    function addKillLog(killer, victim, color) {
      const feed = document.getElementById('kill-feed');
      const item = document.createElement('div');
      item.className = 'bg-slate-900/90 border border-slate-700/60 text-slate-200 px-3 py-1 rounded-lg text-xs shadow-md flex items-center gap-1.5 animate-pulse';
      item.innerHTML = `
        <span class="font-bold" style="color: ${color}">${killer}</span>
        <i class="fa-solid fa-crosshairs text-slate-500 text-[10px]"></i>
        <span class="text-slate-400">${victim}</span>
      `;
      feed.appendChild(item);
      setTimeout(() => item.remove(), 4000);
    }

    function showToast(msg, type = 'info') {
      const container = document.getElementById('toast-container');
      const toast = document.createElement('div');
      const colors = {
        success: 'border-emerald-500 text-emerald-300',
        error: 'border-rose-500 text-rose-300',
        warning: 'border-amber-500 text-amber-300',
        info: 'border-cyan-500 text-cyan-300'
      };
      toast.className = `glass-panel border-l-4 ${colors[type]} px-4 py-2.5 rounded-lg text-xs font-orbitron font-bold shadow-xl transition-all duration-300 opacity-100 pointer-events-auto`;
      toast.innerHTML = msg;
      container.appendChild(toast);
      setTimeout(() => {
        toast.style.opacity = '0';
        setTimeout(() => toast.remove(), 300);
      }, 3000);
    }

    function startSoloMode() {
      isSoloMode = true;
      currentRoomId = 'BOT_ARENA';
      localPlayer.isHost = true;
      players = {};

      // Add 3 AI Bots
      for (let i = 1; i <= 3; i++) {
        const botId = 'bot_' + i;
        const color = TANK_COLORS[i % TANK_COLORS.length];
        const archKeys = Object.keys(ARCHETYPES);
        const randArch = archKeys[Math.floor(Math.random() * archKeys.length)];

        players[botId] = {
          id: botId,
          name: `BOT_NEON_${i}`,
          color: color,
          archetype: randArch,
          x: 200 + i * 150,
          y: 200 + i * 100,
          angle: 0,
          turretAngle: 0,
          hp: 100,
          maxHp: 100,
          shield: 0,
          score: 0,
          kills: 0,
          deaths: 0,
          isHost: false,
          isBot: true,
          lastShotTime: 0
        };
      }
      switchState('LOBBY');
      renderLobbyUI();
    }

    function startBattleSession() {
      generateArenaMap(roomData?.map || 'cyber_grid');
      document.getElementById('hud-room-tag').innerText = `ROOM: ${currentRoomId || 'SOLO'}`;
      document.getElementById('hud-score-limit').innerText = `${roomData?.scoreLimit || 15} KILLS`;

      respawnTank(localPlayer);
      switchState('PLAYING');
      updateHUDStatus();

      if (localPlayer.isHost && db && currentRoomId && !isSoloMode) {
        updateDoc(getRoomRef(currentRoomId), { status: 'PLAYING' });
      }
    }

    function triggerVictoryState(winner) {
      switchState('VICTORY');
      const winnerName = winner?.name || localPlayer.name;
      document.getElementById('victory-winner-name').innerText = `${winnerName} DOMINATED THE ARENA!`;

      const statsContainer = document.getElementById('victory-stats');
      statsContainer.innerHTML = '';
      const all = [localPlayer, ...Object.values(players)].sort((a, b) => b.score - a.score);

      all.forEach((p, idx) => {
        const row = document.createElement('div');
        row.className = 'flex justify-between items-center text-xs py-1 border-b border-slate-800 last:border-0';
        row.innerHTML = `
          <span class="font-bold text-slate-300">#${idx + 1} ${p.name}</span>
          <span class="text-amber-400 font-mono">${p.kills} Kills / ${p.deaths} Deaths</span>
        `;
        statsContainer.appendChild(row);
      });

      if (localPlayer.isHost && db && currentRoomId && !isSoloMode) {
        updateDoc(getRoomRef(currentRoomId), { status: 'VICTORY', winner });
      }
    }

    // ------------------------------------------------------------------
    // 10. SETUP MENU BINDINGS & URL ROOM PARSER
    // ------------------------------------------------------------------
    window.addEventListener('load', async () => {
      await initFirebase();
      setupTouchControls();

      // Dynamically Build Color Selector
      const colorGroup = document.getElementById('color-picker-group');
      TANK_COLORS.forEach(c => {
        const btn = document.createElement('button');
        btn.className = `w-7 h-7 rounded-full border-2 border-slate-700 transition-transform transform hover:scale-110 ${c === localPlayer.color ? 'ring-2 ring-white scale-110' : ''}`;
        btn.style.backgroundColor = c;
        btn.onclick = () => {
          localPlayer.color = c;
          Array.from(colorGroup.children).forEach(el => el.classList.remove('ring-2', 'ring-white', 'scale-110'));
          btn.classList.add('ring-2', 'ring-white', 'scale-110');
        };
        colorGroup.appendChild(btn);
      });

      // Dynamically Build Archetype Selector
      const archGroup = document.getElementById('tank-archetype-group');
      Object.keys(ARCHETYPES).forEach(key => {
        const arch = ARCHETYPES[key];
        const card = document.createElement('div');
        card.className = `bg-slate-950 p-2.5 rounded-xl border border-slate-800 cursor-pointer flex flex-col items-center text-center transition-all ${key === localPlayer.archetype ? 'neon-border-cyan' : ''}`;
        card.innerHTML = `
          <i class="fa-solid ${arch.icon} text-cyan-400 text-base mb-1"></i>
          <span class="text-xs font-bold font-orbitron text-white">${arch.name}</span>
          <span class="text-[9px] text-slate-400 font-sans mt-0.5">${arch.colorDesc}</span>
        `;
        card.onclick = () => {
          localPlayer.archetype = key;
          Array.from(archGroup.children).forEach(el => el.classList.remove('neon-border-cyan'));
          card.classList.add('neon-border-cyan');
        };
        archGroup.appendChild(card);
      });

      // Name Input handler
      document.getElementById('input-player-name').addEventListener('input', (e) => {
        localPlayer.name = e.target.value.toUpperCase() || 'PILOT';
      });

      // Button Listeners
      document.getElementById('btn-create-room').onclick = createRoomFirebase;
      document.getElementById('btn-join-room').onclick = () => {
        const code = document.getElementById('input-room-code').value;
        joinRoomFirebase(code);
      };
      document.getElementById('btn-bot-mode').onclick = startSoloMode;

      document.getElementById('btn-copy-link').onclick = () => {
        const link = `${window.location.origin}${window.location.pathname}?room=${currentRoomId}`;
        const tempInput = document.createElement('input');
        document.body.appendChild(tempInput);
        tempInput.value = link;
        tempInput.select();
        document.execCommand('copy');
        document.body.removeChild(tempInput);
        showToast('Invite link copied to clipboard!', 'success');
      };

      document.getElementById('btn-add-bot').onclick = () => {
        const botCount = Object.keys(players).filter(id => players[id].isBot).length + 1;
        const botId = 'bot_' + Math.random().toString(36).substring(2, 6);
        players[botId] = {
          id: botId,
          name: `BOT_NEON_${botCount}`,
          color: TANK_COLORS[botCount % TANK_COLORS.length],
          archetype: 'viper',
          x: 400,
          y: 400,
          angle: 0,
          turretAngle: 0,
          hp: 100,
          maxHp: 100,
          shield: 0,
          score: 0,
          kills: 0,
          deaths: 0,
          isHost: false,
          isBot: true,
          lastShotTime: 0
        };
        renderLobbyUI();
        showToast(`AI Bot Added!`, 'info');
      };

      document.getElementById('btn-start-game').onclick = () => {
        roomData = {
          map: document.getElementById('select-map').value,
          scoreLimit: parseInt(document.getElementById('select-score-limit').value)
        };
        startBattleSession();
      };

      document.getElementById('btn-leave-lobby').onclick = () => {
        if (roomUnsubscribe) roomUnsubscribe();
        switchState('MENU');
      };

      document.getElementById('btn-return-lobby').onclick = () => {
        switchState('LOBBY');
      };

      document.getElementById('btn-toggle-sound').onclick = () => {
        audioEnabled = !audioEnabled;
        document.getElementById('sound-icon').className = audioEnabled ? 'fa-solid fa-volume-high' : 'fa-solid fa-volume-xmark';
        document.getElementById('btn-toggle-sound').innerText = `Audio FX: ${audioEnabled ? 'ON' : 'OFF'}`;
      };

      // Check for ?room=CODE in URL parameters
      const urlParams = new URLSearchParams(window.location.search);
      const roomParam = urlParams.get('room');
      if (roomParam && roomParam.length === 6) {
        document.getElementById('input-room-code').value = roomParam.toUpperCase();
        showToast(`Room code ${roomParam.toUpperCase()} detected! Click Join.`, 'info');
      }

      // Start loop
      requestAnimationFrame(gameLoop);
    });
  </script>
